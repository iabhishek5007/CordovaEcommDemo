<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' https://dummyjson.com data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content: https://dummyjson.com https://cdn.dummyjson.com;"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="initial-scale=1, width=device-width, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Cordova E-Commerce</title>

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <!-- App Container -->
    <div id="app-container">
      <!-- Content will be dynamically loaded here -->
    </div>

    <!-- Loader -->
    <div id="loader" class="hidden">
      <div class="spinner"></div>
    </div>

    <!-- Templates -->

    <!-- Login Template -->
    <script type="text/template" id="login-template">
      <div class="login-container">
          <h1><%= APP_STRINGS.LOGIN_TITLE %></h1>
          <div class="form-group">
              <label for="username"><%= APP_STRINGS.USERNAME_LABEL %></label>
              <input type="text" id="username" placeholder="<%= APP_STRINGS.USERNAME_PLACEHOLDER %>">
          </div>
          <div class="form-group">
              <label for="password"><%= APP_STRINGS.PASSWORD_LABEL %></label>
              <input type="password" id="password" placeholder="<%= APP_STRINGS.PASSWORD_PLACEHOLDER %>">
          </div>
          <div class="error-message hidden"></div>
          <button id="login-btn" class="btn-primary"><%= APP_STRINGS.LOGIN_BUTTON %></button>
      </div>
    </script>

    <!-- Product List Template -->
    <script type="text/template" id="product-list-template">
      <div class="product-container">
          <div class="app-header">
            <div class="welcome-banner">
                <h2><%= APP_STRINGS.WELCOME_MESSAGE %> <%= username %></h2>
            </div>
            <div id="header-cart-icon" class="cart-icon-container">
                <a href="#cart">
                    <img src="img/cart_icon.svg" alt="Cart" /> <!-- Assuming you have a cart_icon.svg in img folder -->
                    <span class="cart-count" style="display:none;">0</span>
                </a>
            </div>
          </div>
          <h1><%= APP_STRINGS.PRODUCTS_TITLE %></h1>
          <div class="product-grid">
              <% _.each(products, function(product) { %>
                  <div class="product-card">
                      <div class="product-image">
                          <img src="<%= product.thumbnail %>" alt="<%= product.title %>">
                      </div>
                      <div class="product-info">
                          <h3><%= product.title %></h3>
                          <p class="product-description"><%= product.description.substring(0, 60) %>...</p>
                          <div class="product-meta">
                              <span class="product-price">$<%= product.price %></span>
                              <span class="product-rating">★ <%= product.rating %></span>
                          </div>
                          <div class="product-stock <%= product.stock < 10 ? 'low-stock' : '' %>">
                              <%= product.stock < 10 ? APP_STRINGS.LOW_STOCK : APP_STRINGS.IN_STOCK %>
                          </div>
                          <button class="btn-add-to-cart" data-product-id="<%= product.id %>"><%= APP_STRINGS.ADD_TO_CART_BUTTON %></button>
                      </div>
                  </div>
              <% }); %>
          </div>
      </div>
    </script>

    <!-- Cart Template -->
    <script type="text/template" id="cart-template">
      <div class="cart-container">
        <div class="app-header">
            <h1><%= APP_STRINGS.CART_TITLE %></h1>
            <div id="header-cart-icon" class="cart-icon-container">
                <a href="#cart">
                    <img src="img/cart_icon.svg" alt="Cart" />
                    <span class="cart-count <%= totalItemCount > 0 ? '' : 'hidden' %>"><%= totalItemCount %></span>
                </a>
            </div>
        </div>
        <% if (items.length === 0) { %>
          <p class="empty-cart-message"><%= APP_STRINGS.CART_EMPTY %></p>
          <a href="#products" class="btn-primary"><%= APP_STRINGS.CONTINUE_SHOPPING %></a>
        <% } else { %>
          <div class="cart-items-list">
            <% _.each(items, function(item) { %>
              <div class="cart-item" data-id="<%= item.id %>">
                <img src="<%= item.thumbnail || item.image %>" alt="<%= item.title || item.name %>" class="cart-item-image">
                <div class="cart-item-details">
                  <h3><%= item.title || item.name %></h3>
                  <p class="cart-item-price">$<%= item.price.toFixed(2) %></p>
                  <div class="cart-item-quantity">
                    <button class="btn-quantity decrease-quantity" data-id="<%= item.id %>">-</button>
                    <input type="number" class="item-quantity-input" value="<%= item.quantity %>" min="0" data-id="<%= item.id %>">
                    <button class="btn-quantity increase-quantity" data-id="<%= item.id %>">+</button>
                  </div>
                </div>
                <div class="cart-item-subtotal">
                    <p>$<%= (item.price * item.quantity).toFixed(2) %></p>
                    <button class="btn-remove remove-item" data-id="<%= item.id %>"><%= APP_STRINGS.REMOVE_BUTTON %></button>
                </div>
              </div>
            <% }); %>
          </div>
          <div class="cart-summary">
            <h3><%= APP_STRINGS.CART_SUMMARY_TITLE %></h3>
            <p><%= APP_STRINGS.TOTAL_ITEMS_LABEL %>: <span id="cart-total-items"><%= totalItemCount %></span></p>
            <p><%= APP_STRINGS.TOTAL_PRICE_LABEL %>: <span id="cart-total-price">$<%= totalPrice.toFixed(2) %></span></p>
            <button id="proceed-to-checkout" class="btn-primary btn-checkout"><%= APP_STRINGS.PROCEED_TO_CHECKOUT_BUTTON %></button>
          </div>
        <% } %>
      </div>
    </script>

    <!-- Address & Payment Template -->
    <script type="text/template" id="address-template">
      <div class="address-container">
        <div class="app-header">
            <h1><%= APP_STRINGS.ADDRESS_PAYMENT_TITLE %></h1>
        </div>
        <form id="address-form">
          <h3><%= APP_STRINGS.DELIVERY_ADDRESS_LABEL %></h3>
          <div class="form-group">
            <label for="full-name"><%= APP_STRINGS.FULL_NAME_LABEL %></label>
            <input type="text" id="full-name" value="<%= user.firstName ? user.firstName + ' ' + user.lastName : '' %>" required>
          </div>
          <div class="form-group">
            <label for="address-line1"><%= APP_STRINGS.ADDRESS_LINE1_LABEL %></label>
            <input type="text" id="address-line1" required>
          </div>
          <div class="form-group">
            <label for="address-line2"><%= APP_STRINGS.ADDRESS_LINE2_LABEL %></label>
            <input type="text" id="address-line2">
          </div>
          <div class="form-group">
            <label for="city"><%= APP_STRINGS.CITY_LABEL %></label>
            <input type="text" id="city" required>
          </div>
          <div class="form-group">
            <label for="state"><%= APP_STRINGS.STATE_LABEL %></label>
            <input type="text" id="state" required>
          </div>
          <div class="form-group">
            <label for="zip-code"><%= APP_STRINGS.ZIP_CODE_LABEL %></label>
            <input type="text" id="zip-code" pattern="[0-9]{5}" required>
          </div>
          <div class="form-group">
            <label for="phone-number"><%= APP_STRINGS.PHONE_NUMBER_LABEL %></label>
            <input type="tel" id="phone-number" pattern="[0-9]{10}" required>
          </div>

          <h3><%= APP_STRINGS.PAYMENT_METHOD_LABEL %></h3>
          <div class="form-group payment-options">
            <label><input type="radio" name="payment-method" value="cod" checked> <%= APP_STRINGS.PAYMENT_COD %></label>
            <label><input type="radio" name="payment-method" value="online"> <%= APP_STRINGS.PAYMENT_ONLINE %></label>
          </div>

          <div class="order-summary-preview">
            <h4><%= APP_STRINGS.ORDER_SUMMARY_TITLE %></h4>
            <p><%= APP_STRINGS.TOTAL_PAYABLE_LABEL %>: $<%= cartTotal.toFixed(2) %></p>
          </div>

          <div class="error-message hidden"></div>
          <button type="submit" id="submit-order" class="btn-primary"><%= APP_STRINGS.SUBMIT_ORDER_BUTTON %></button>
        </form>
      </div>
    </script>

    <!-- Libraries -->
    <script src="cordova.js"></script>
    <script src="js/lib/jquery.min.js"></script>
    <script src="js/lib/underscore-min.js"></script>
    <script src="js/lib/backbone-min.js"></script>

    <!-- Constants -->
    <script src="js/constants/strings.js"></script>
    <script src="js/constants/config.js"></script>

    <!-- Utilities -->
    <script src="js/utils/ajax-utils.js"></script>
    <script src="js/utils/storage-utils.js"></script>
    <script src="js/utils/ui-utils.js"></script>

    <!-- App Namespace Initializer -->
    <script src="js/init-app.js"></script>

    <!-- Models -->
    <script src="js/models/user-model.js"></script>
    <script src="js/models/product-model.js"></script>
    <script src="js/models/cart-model.js"></script>
    <!-- Cart Model -->

    <!-- Views -->
    <script src="js/views/login-view.js"></script>
    <script src="js/views/product-view.js"></script>
    <script src="js/views/cart-view.js"></script>
    <!-- Cart View -->
    <script src="js/views/address-view.js"></script>
    <!-- Address View -->

    <!-- Controllers -->
    <script src="js/controllers/auth-controller.js"></script>
    <script src="js/controllers/product-controller.js"></script>
    <script src="js/controllers/cart-controller.js"></script>
    <!-- Cart Controller -->

    <!-- Main App -->
    <script src="js/app.js"></script>
  </body>
</html>
